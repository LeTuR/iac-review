[project]
name = "iac-review"
version = "0.1.0"
description = "Modular review of Infrastructure-as-Code changes on a pull or merge request."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LeTuR" }]
keywords = ["terraform", "azure", "code-review", "drawio", "avm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "python-hcl2>=8.1.3",
]

[project.urls]
Homepage = "https://github.com/LeTuR/iac-review"
Issues = "https://github.com/LeTuR/iac-review/issues"

[project.scripts]
iac-review = "iac_review.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "mypy>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "iac_review"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "hcl2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
